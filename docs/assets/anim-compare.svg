<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Animated: how the whole shell corpus is compared. 3,452 cases are cut into 64 shards, with _06_issues holding half of everything and split into sub-shards; every case lands in exactly one shard. One shard runs on CTP and on testkit, both result trees are kept, and a shard whose report already ends in COMPLETE is skipped, so the loop survives being killed. In the report the six files that carry verdicts must be identical with no baseline allowed, and the other four are classified: on the four-case calibration 154 differences became 143 known and 11 new, and ten of the eleven are one finding.">
<style>
  .ttl{font-size:15px;font-weight:700;fill:#1f2937}
  .sub{font-size:11px;fill:#6b7280}
  .band{font-size:9px;font-weight:700;fill:#9ca3af;letter-spacing:1.1px}
  .h{font-size:11.5px;font-weight:700;fill:#1f2937}
  .d{font-size:9.5px;fill:#6b7280}
  .mg{font-size:9px;fill:#6b7280;font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .mgd{font-size:9px;fill:#1f2937;font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .box{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
  .note{font-size:9px;fill:#9ca3af}
</style>
<rect x="0" y="0" width="880" height="372" fill="#ffffff"/>

<text class="ttl" x="10" y="20">Widening the corpus: 64 shards, and a report whose only product is NEW</text>
<text class="sub" x="10" y="36">Four cases were compared by hand. 3,452 cannot be — so the differences that have been seen before are named, and what is left is the finding.</text>

<!-- ================= band 1: the corpus, cut ================= -->
<rect class="box" x="10" y="52" width="860" height="92" rx="5"/>
<text class="band" x="24" y="70">THE CORPUS, CUT INTO UNITS OF WORK AND OF RESUME</text>
<text class="mg" x="856" y="70" text-anchor="end">shards.sh</text>

<g>
  <rect x="24" y="80" width="415" height="18" fill="#eef2ff" stroke="#6366f1"/>
  <rect x="439" y="80" width="61"  height="18" fill="#f9fafb" stroke="#d1d5db"/>
  <rect x="500" y="80" width="52"  height="18" fill="#f9fafb" stroke="#d1d5db"/>
  <rect x="552" y="80" width="47"  height="18" fill="#fffbeb" stroke="#b45309"/>
  <rect x="599" y="80" width="41"  height="18" fill="#f9fafb" stroke="#d1d5db"/>
  <rect x="640" y="80" width="33"  height="18" fill="#f9fafb" stroke="#d1d5db"/>
  <rect x="673" y="80" width="22"  height="18" fill="#f9fafb" stroke="#d1d5db"/>
  <rect x="695" y="80" width="161" height="18" fill="#f9fafb" stroke="#d1d5db"/>
</g>
<text class="mg" x="231" y="93" text-anchor="middle" fill="#4338ca">_06_issues — 1,721</text>
<text class="mg" x="575" y="93" text-anchor="middle" fill="#b45309">_25_unstable</text>
<text class="mg" x="775" y="93" text-anchor="middle">twenty-eight more families</text>

<text class="d" x="24" y="114">One family holds half of everything, so it is split — but only where the subdirectories account for every case.</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.10;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
  <rect x="24" y="120" width="415" height="12" fill="none" stroke="#6366f1" stroke-dasharray="2 3"/>
  <line x1="59"  y1="120" x2="59"  y2="132" stroke="#6366f1"/><line x1="94"  y1="120" x2="94"  y2="132" stroke="#6366f1"/>
  <line x1="129" y1="120" x2="129" y2="132" stroke="#6366f1"/><line x1="164" y1="120" x2="164" y2="132" stroke="#6366f1"/>
  <line x1="199" y1="120" x2="199" y2="132" stroke="#6366f1"/><line x1="234" y1="120" x2="234" y2="132" stroke="#6366f1"/>
  <line x1="269" y1="120" x2="269" y2="132" stroke="#6366f1"/><line x1="304" y1="120" x2="304" y2="132" stroke="#6366f1"/>
  <line x1="339" y1="120" x2="339" y2="132" stroke="#6366f1"/><line x1="374" y1="120" x2="374" y2="132" stroke="#6366f1"/>
  <line x1="409" y1="120" x2="409" y2="132" stroke="#6366f1"/>
  <text class="mg" x="452" y="130" fill="#4338ca">64 shards &#183; 3,452 cases &#183; every case in exactly one &#183; two cannot be split and go out oversized, saying so</text>
</g>

<!-- ================= band 2: one shard ================= -->
<rect class="box" x="10" y="154" width="860" height="80" rx="5"/>
<text class="band" x="24" y="172">ONE SHARD</text>
<text class="mg" x="856" y="172" text-anchor="end">shard.sh</text>

<rect class="box" x="24"  y="186" width="150" height="24" rx="3"/>
<text class="mg" x="99" y="201" text-anchor="middle">scenario=&lt;shard&gt;</text>

<g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.24;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
  <line x1="174" y1="198" x2="200" y2="198" stroke="#9ca3af"/>
  <rect x="200" y="176" width="112" height="20" rx="3" fill="#ffffff" stroke="#d1d5db"/>
  <text class="mg" x="256" y="190" text-anchor="middle">ctp.sh shell</text>
  <rect x="200" y="200" width="112" height="20" rx="3" fill="#ffffff" stroke="#d1d5db"/>
  <text class="mg" x="256" y="214" text-anchor="middle">testkit shell</text>
</g>

<g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.34;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
  <line x1="312" y1="186" x2="336" y2="196" stroke="#9ca3af"/>
  <line x1="312" y1="210" x2="336" y2="200" stroke="#9ca3af"/>
  <rect x="336" y="186" width="118" height="24" rx="3" fill="#ffffff" stroke="#d1d5db"/>
  <text class="mg" x="395" y="201" text-anchor="middle">two result trees</text>
  <line x1="454" y1="198" x2="478" y2="198" stroke="#9ca3af"/>
  <rect x="478" y="186" width="110" height="24" rx="3" fill="#ffffff" stroke="#d1d5db"/>
  <text class="mg" x="533" y="201" text-anchor="middle">compare.sh</text>
  <line x1="588" y1="198" x2="612" y2="198" stroke="#9ca3af"/>
  <rect x="612" y="186" width="104" height="24" rx="3" fill="#f9fafb" stroke="#d1d5db"/>
  <text class="mg" x="664" y="201" text-anchor="middle">report.txt</text>
</g>
<text class="d" x="24" y="226">Both trees are kept beside the report, so a finding can be re-examined without running anything again.</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.40;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
  <text class="mg" x="856" y="226" text-anchor="end" fill="#1a7f37">a report ending in COMPLETE is skipped &#8212; the loop survives being killed</text></g>

<!-- ================= band 3: what the report says ================= -->
<rect class="box" x="10" y="244" width="860" height="106" rx="5"/>
<text class="band" x="24" y="262">WHAT THE REPORT SAYS</text>
<text class="mg" x="856" y="262" text-anchor="end">classify.awk &#183; baseline.txt</text>

<text class="h" x="24" y="282">Six files carry the verdicts</text>
<text class="mg" x="24" y="298">dispatch_tc_ALL &#183; dispatch_tc_FIN &#183; test_status.data</text>
<text class="mg" x="24" y="312">check_&lt;env&gt;.log &#183; current_task_id &#183; monitor_&lt;env&gt;.log</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.52;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
  <rect x="24" y="320" width="330" height="18" rx="3" fill="#f0fdf4" stroke="#1a7f37"/>
  <text class="mg" x="34" y="333" fill="#1a7f37">held to zero differences &#8212; the baseline is not applied to these</text></g>

<line x1="392" y1="272" x2="392" y2="340" stroke="#e5e7eb"/>

<text class="h" x="416" y="282">The other four are classified</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.62;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
  <rect x="416" y="288" width="150" height="18" rx="3" fill="#f9fafb" stroke="#9ca3af"/>
  <text class="mgd" x="426" y="301">154 differences</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.72;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
  <line x1="566" y1="297" x2="590" y2="297" stroke="#9ca3af"/>
  <rect x="590" y="288" width="266" height="18" rx="3" fill="#f9fafb" stroke="#d1d5db"/>
  <text class="mg" x="600" y="301">143 known &#8212; ctp-self-update 105, reset-noise 20, blank 8, ...</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.84;1" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
  <rect x="416" y="314" width="150" height="24" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text class="mgd" x="426" y="330" fill="#c0392b" font-weight="700">NEW &#8212; 11 lines</text>
  <text class="mg" x="590" y="330">ten of them are one finding: csql_help&#8217;s console shape, still open</text></g>

<text class="note" x="10" y="366">Calibrated against the four-case artifacts of 2026-09-02, with the console duplication fixed. A baseline names what has been seen; it never judges it acceptable.  docs/evidence/compare/</text>
</svg>
