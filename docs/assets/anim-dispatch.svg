<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Animated: one binary and one registry lookup. unittest goes to the native runner; shell goes to CTP as a subprocess while TESTKIT_NATIVE_SHELL is unset and to the native runner when it is set to 1. Both paths write the same frozen output, so from outside there is no way to tell which ran.">
<style>
  .ttl{font-size:15px;font-weight:700;fill:#1f2937}
  .sub{font-size:11px;fill:#6b7280}
  .band{font-size:9px;font-weight:700;fill:#9ca3af;letter-spacing:1.1px}
  .h{font-size:11.5px;font-weight:700;fill:#1f2937}
  .d{font-size:9.5px;fill:#6b7280}
  .m{font-size:10px;fill:#2563eb;font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .mg{font-size:9px;fill:#9ca3af;font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .box{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
  .hdbox{fill:#eef2f7;stroke:#d1d5db;stroke-width:1}
  .outbox{fill:#fafafa;stroke:#e5e7eb;stroke-width:1;stroke-dasharray:3 3}
  .arw{stroke:#9ca3af;stroke-width:1.4;fill:none;marker-end:url(#a)}
  .note{font-size:9px;fill:#9ca3af}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
  <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs>
<rect x="0" y="0" width="880" height="300" fill="#ffffff"/>

<text class="ttl" x="10" y="20">One binary, one lookup — and from outside there is no way to tell which ran</text>
<text class="sub" x="10" y="36">Every entry script hands its arguments over unchanged. A single registry turns the task name into a runner. Both paths write the same output.</text>

<rect class="box" x="10" y="52" width="860" height="34" rx="5"/>
<text class="m" x="24" y="74">$ testkit unittest -c unittest.conf<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="m" x="24" y="74" opacity="0">$ testkit shell -c shell.conf<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.333;0.666;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="m" x="24" y="74" opacity="0">$ TESTKIT_NATIVE_SHELL=1 testkit shell -c shell.conf<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.666;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="note" x="856" y="74" text-anchor="end">bin/ctp.sh is a shim: same argv, same env</text>
<path class="arw" d="M440 86 L440 106"/>

<rect class="hdbox" x="300" y="110" width="280" height="44" rx="5"/>
<text class="h" x="440" y="130" text-anchor="middle">registry</text>
<text class="d" x="440" y="146" text-anchor="middle">one task name, one runner</text>

<path class="arw" d="M298 132 L216 132"/>
<path class="arw" d="M582 132 L664 132"/>
<circle r="4" fill="#1a7f37" opacity="0">
  <animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.333;0.666;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <animate attributeName="cx" values="294;220" dur="1.4s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="132;132" dur="1.4s" repeatCount="indefinite"/>
</circle>
<circle r="4" fill="#9ca3af" opacity="0">
  <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.333;0.666;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <animate attributeName="cx" values="586;660" dur="1.4s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="132;132" dur="1.4s" repeatCount="indefinite"/>
</circle>

<rect x="30" y="110" width="186" height="88" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1">
  <animate attributeName="fill" values="#f0fdf4;#ffffff;#f0fdf4" keyTimes="0;0.333;0.666" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <animate attributeName="stroke" values="#1a7f37;#d1d5db;#1a7f37" keyTimes="0;0.333;0.666" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <animate attributeName="stroke-width" values="1.6;1;1.6" keyTimes="0;0.333;0.666" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
</rect>
<text class="h" x="44" y="132">native runner</text>
<text class="d" x="44" y="150">Go, in this process</text>
<text class="mg" x="44" y="170">unittest<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="fill" values="#1a7f37;#9ca3af" keyTimes="0;0.333" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="mg" x="44" y="170" opacity="0">idle<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.333;0.666;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="mg" x="44" y="170" fill="#1a7f37" opacity="0">shell<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.666;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="d" x="44" y="188">rewritten: unittest, shell</text>

<rect x="664" y="110" width="186" height="88" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 3">
  <animate attributeName="stroke-width" values="1.2;2;1.2" keyTimes="0;0.333;0.666" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <animate attributeName="stroke" values="#9ca3af;#6b7280;#9ca3af" keyTimes="0;0.333;0.666" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
</rect>
<text class="h" x="678" y="132">legacy runner</text>
<text class="d" x="678" y="150">the original CTP, as a subprocess</text>
<text class="mg" x="678" y="170">idle<animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.333;0.666;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="mg" x="678" y="170" fill="#6b7280" opacity="0">shell → java -cp … CTP<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.333;0.666;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="d" x="678" y="188">argv and env, byte for byte</text>

<rect class="box" x="300" y="164" width="280" height="26" rx="4"/>
<text class="mg" x="312" y="181">TESTKIT_NATIVE_SHELL</text>
<text class="mg" x="568" y="181" text-anchor="end">not consulted<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="mg" x="568" y="181" text-anchor="end" opacity="0">unset<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.333;0.666;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="mg" x="568" y="181" text-anchor="end" fill="#1a7f37" opacity="0">= 1<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.666;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

<path class="arw" d="M123 198 L123 214"/>
<path class="arw" d="M757 198 L757 214"/>

<rect class="outbox" x="10" y="216" width="860" height="56" rx="5"/>
<text class="band" x="24" y="234">FROZEN OUTPUT — the surface belongs to this layer, not to whichever runner produced it</text>
<text class="mg" x="24" y="254">main.info  ·  summary_info  ·  test_status.data  ·  check_local.log  ·  dispatch_tc_ALL.txt  ·  current_task_id  ·  exit code</text>
<text class="d" x="856" y="254" text-anchor="end" fill="#1a7f37">byte-identical either way</text>

<text class="note" x="10" y="292">A second claim on a task replaces the first, which is the whole mechanism of the migration: register legacy, then register the rewritten runner over it.  docs/design/architecture.md</text>
</svg>
