<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 342" width="880" height="342" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Animated: CTP and testkit run on the same four cases on the same machine in the same minute. Both report three passed and one failed, the same case failing on both, and exit 0. Of the ten files a run leaves behind, six are byte-identical after normalisation, one is identical once the JVM's own properties are removed, and three differ by a named number of lines.">
<style>
  .ttl{font-size:15px;font-weight:700;fill:#1f2937}
  .sub{font-size:11px;fill:#6b7280}
  .band{font-size:9px;font-weight:700;fill:#9ca3af;letter-spacing:1.1px}
  .h{font-size:11.5px;font-weight:700;fill:#1f2937}
  .d{font-size:9.5px;fill:#6b7280}
  .mg{font-size:9px;fill:#6b7280;font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .box{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
  .note{font-size:9px;fill:#9ca3af}
</style>
<rect x="0" y="0" width="880" height="342" fill="#ffffff"/>

<text class="ttl" x="10" y="20">Proving equivalence: normalise, then diff</text>
<text class="sub" x="10" y="36">The same cases, on the same machine, in the same minute — CTP on one side, testkit on the other, both inside a PID and IPC namespace.</text>

<rect class="box" x="10" y="56" width="860" height="132" rx="5"/>
<text class="band" x="24" y="76">CASE</text>
<text class="band" x="640" y="76" text-anchor="middle">CTP</text>
<text class="band" x="768" y="76" text-anchor="middle">TESTKIT</text>

<text class="mg" x="24" y="102">_01_utility/_23_optimizedb/itrack_10001</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.08;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <rect x="612" y="90" width="56" height="16" rx="8" fill="#f0fdf4" stroke="#1a7f37"/><text x="640" y="102" text-anchor="middle" font-size="9" font-weight="700" fill="#1a7f37">OK</text>
  <rect x="740" y="90" width="56" height="16" rx="8" fill="#f0fdf4" stroke="#1a7f37"/><text x="768" y="102" text-anchor="middle" font-size="9" font-weight="700" fill="#1a7f37">OK</text></g>

<text class="mg" x="24" y="126">_01_utility/_38_csql/csql1</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.14;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <rect x="612" y="114" width="56" height="16" rx="8" fill="#fdecea" stroke="#c0392b"/><text x="640" y="126" text-anchor="middle" font-size="9" font-weight="700" fill="#c0392b">NOK</text>
  <rect x="740" y="114" width="56" height="16" rx="8" fill="#fdecea" stroke="#c0392b"/><text x="768" y="126" text-anchor="middle" font-size="9" font-weight="700" fill="#c0392b">NOK</text></g>

<text class="mg" x="24" y="150">_01_utility/_38_csql/csql_help</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.20;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <rect x="612" y="138" width="56" height="16" rx="8" fill="#f0fdf4" stroke="#1a7f37"/><text x="640" y="150" text-anchor="middle" font-size="9" font-weight="700" fill="#1a7f37">OK</text>
  <rect x="740" y="138" width="56" height="16" rx="8" fill="#f0fdf4" stroke="#1a7f37"/><text x="768" y="150" text-anchor="middle" font-size="9" font-weight="700" fill="#1a7f37">OK</text></g>

<text class="mg" x="24" y="174">_01_utility/_12_spacedb/itrack_10002</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.26;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>
  <rect x="612" y="162" width="56" height="16" rx="8" fill="#f0fdf4" stroke="#1a7f37"/><text x="640" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#1a7f37">OK</text>
  <rect x="740" y="162" width="56" height="16" rx="8" fill="#f0fdf4" stroke="#1a7f37"/><text x="768" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#1a7f37">OK</text></g>

<text class="h" x="24" y="204" opacity="0">3 passed · 1 failed · the same case failing on both · the same summary counters · exit 0<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.30;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="mg" x="856" y="204" text-anchor="end" opacity="0">AUTO_TEST_VERSION and AUTO_TEST_BITS also match<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.30;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

<rect class="box" x="10" y="216" width="860" height="106" rx="5"/>
<text class="band" x="24" y="234">TEN FILES, AFTER normalize.sh</text>
<text class="mg" x="856" y="234" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.90;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/>6 identical · 1 identical without the JVM&#39;s own properties · 3 with a named reason</text>

<text class="mg" x="24" y="256">dispatch_tc_ALL.txt</text>
<text class="mg" x="300" y="256" fill="#1a7f37" opacity="0">identical<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.38;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="mg" x="24" y="274">dispatch_tc_FIN_local.txt</text>
<text class="mg" x="300" y="274" fill="#1a7f37" opacity="0">identical<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.43;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="mg" x="24" y="292">test_status.data</text>
<text class="mg" x="300" y="292" fill="#1a7f37" opacity="0">identical — carries the verdicts<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.48;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="mg" x="24" y="310">check_local.log</text>
<text class="mg" x="300" y="310" fill="#1a7f37" opacity="0">identical — 21 lines<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.53;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

<text class="mg" x="452" y="256">current_task_id</text>
<text class="mg" x="700" y="256" fill="#1a7f37" opacity="0">identical<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.58;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="mg" x="452" y="274">monitor_local.log</text>
<text class="mg" x="700" y="274" fill="#1a7f37" opacity="0">identical — empty on both<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.63;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="mg" x="452" y="292">main_snapshot.properties</text>
<text class="mg" x="700" y="292" fill="#9a6700" opacity="0">identical, minus JVM properties<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.70;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>
<text class="mg" x="452" y="310">feedback.log · test-shell.xml · test_local.log</text>
<text class="mg" x="700" y="310" fill="#9a6700" opacity="0">8 / 13 / 652 lines, each named<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.80;1" dur="12s" calcMode="discrete" repeatCount="indefinite"/></text>

<text class="note" x="10" y="336">Four cases, not 3,452 — this does not clear the gate. What it establishes is that the two runners agree where it matters.  ADR-013 · docs/evidence/regression-shell.md</text>
</svg>
