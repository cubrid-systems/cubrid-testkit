<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="cubrid-testkit — a test runner that only runs tests: find the cases, run them, judge them, record what happened. Every task it takes over keeps the same commands, the same output and the same exit codes.">
<style>
  .name{font-size:36px;font-weight:700;fill:#f8fafc;letter-spacing:-0.5px}
  .tag{font-size:13.5px;fill:#94a3b8}
  .meta{font-size:11px;fill:#64748b;letter-spacing:1.2px}
  .lbl{font-size:8.5px;font-weight:700;fill:#22c55e;letter-spacing:1.2px}
  .step{font-size:11.5px;font-weight:700;fill:#e2e8f0}
  .sd{font-size:8.5px;fill:#64748b}
  .box{fill:#14532d;stroke:#22c55e;stroke-width:1.3}
  .flow{stroke:#22c55e;stroke-width:1.5;fill:none;marker-end:url(#g)}
</style>
<defs><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
  <path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/></marker></defs>
<rect x="0" y="0" width="880" height="200" fill="#0f172a"/>
<rect x="0" y="0" width="6" height="200" fill="#2563eb"/>

<text class="name" x="40" y="76">cubrid-testkit</text>
<text class="tag"  x="41" y="104">A test runner that only runs tests — find the cases, run them, judge them, record what happened.</text>
<text class="tag"  x="41" y="123">Every task it takes over keeps the same commands, the same output, the same exit codes.</text>
<text class="meta" x="41" y="158">FOR ENGINE DEVELOPERS AND QA · CUBRID SYSTEMS RESEARCH</text>

<text class="lbl" x="510" y="68">THE WHOLE JOB</text>

<rect class="box" x="508" y="80" width="76" height="34" rx="5"/>
<text class="step" x="521" y="101">discover</text>
<text class="sd" x="513" y="128">cases on disk</text>

<rect class="box" x="596" y="80" width="76" height="34" rx="5"/>
<text class="step" x="623" y="101">run</text>
<text class="sd" x="605" y="128">against an engine</text>

<rect class="box" x="684" y="80" width="76" height="34" rx="5"/>
<text class="step" x="702" y="101">judge</text>
<text class="sd" x="695" y="128">pass or fail</text>

<rect class="box" x="772" y="80" width="76" height="34" rx="5"/>
<text class="step" x="789" y="101">record</text>
<text class="sd" x="777" y="128">markers, files</text>

<path class="flow" d="M584 97 L594 97"/>
<path class="flow" d="M672 97 L682 97"/>
<path class="flow" d="M760 97 L770 97"/>
</svg>
