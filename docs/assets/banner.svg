<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="cubrid-testkit — a test runner that only runs tests: find the cases, run them, judge them, write down what happened. Scheduling, notifying and issue filing belong somewhere else.">
<style>
  .name{font-size:36px;font-weight:700;fill:#f8fafc;letter-spacing:-0.5px}
  .tag{font-size:13.5px;fill:#94a3b8}
  .meta{font-size:11px;fill:#64748b;letter-spacing:1.2px}
  .lbl{font-size:8.5px;font-weight:700;letter-spacing:1px}
  .does{font-size:10.5px;font-weight:700;fill:#e2e8f0}
  .nots{font-size:10.5px;fill:#475569}
  .step{fill:#14532d;stroke:#22c55e;stroke-width:1.3}
  .skip{fill:none;stroke:#334155;stroke-width:1;stroke-dasharray:3 3}
  .flow{stroke:#22c55e;stroke-width:1.4;fill:none}
</style>
<rect x="0" y="0" width="880" height="200" fill="#0f172a"/>
<rect x="0" y="0" width="6" height="200" fill="#2563eb"/>

<text class="name" x="40" y="76">cubrid-testkit</text>
<text class="tag"  x="41" y="104">A test runner that only runs tests — find the cases, run them, judge them, record what happened.</text>
<text class="tag"  x="41" y="123">Deciding when to run and who to tell is a different job, and it lives somewhere else.</text>
<text class="meta" x="41" y="158">FOR ENGINE DEVELOPERS AND QA · CUBRID SYSTEMS RESEARCH</text>

<text class="lbl" x="530" y="34" fill="#22c55e">WHAT IT DOES</text>
<rect class="step" x="526" y="42" width="74" height="26" rx="4"/><text class="does" x="540" y="59">discover</text>
<rect class="step" x="612" y="42" width="62" height="26" rx="4"/><text class="does" x="628" y="59">run</text>
<rect class="step" x="686" y="42" width="66" height="26" rx="4"/><text class="does" x="700" y="59">judge</text>
<rect class="step" x="764" y="42" width="78" height="26" rx="4"/><text class="does" x="778" y="59">record</text>
<path class="flow" d="M600 55 L612 55 M674 55 L686 55 M752 55 L764 55"/>

<text class="lbl" x="530" y="106" fill="#475569">WHAT IT DELIBERATELY DOES NOT</text>
<rect class="skip" x="526" y="114" width="88" height="26" rx="4"/><text class="nots" x="540" y="131">schedule</text>
<rect class="skip" x="626" y="114" width="76" height="26" rx="4"/><text class="nots" x="640" y="131">notify</text>
<rect class="skip" x="714" y="114" width="128" height="26" rx="4"/><text class="nots" x="728" y="131">file the issue</text>
<text class="nots" x="526" y="164">CTP did all seven in one program.</text>
<text class="nots" x="526" y="180">This is the first four, pulled out.</text>
</svg>
