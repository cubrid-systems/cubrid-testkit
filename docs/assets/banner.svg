<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="cubrid-testkit — goal: replace CTP one task at a time while everything the outside can see stays byte-identical, and separate what tests the engine from what runs QA">
<style>
  .name{font-size:36px;font-weight:700;fill:#f8fafc;letter-spacing:-0.5px}
  .tag{font-size:13.5px;fill:#94a3b8}
  .meta{font-size:11px;fill:#64748b;letter-spacing:1.2px}
  .chip{font-size:10px;font-weight:700;fill:#e2e8f0}
  .chipo{font-size:10px;fill:#64748b}
  .lbl{font-size:8.5px;font-weight:700;fill:#94a3b8;letter-spacing:1px}
  .new{fill:#14532d;stroke:#22c55e;stroke-width:1.3}
  .old{fill:#1e293b;stroke:#334155;stroke-width:1.1}
  .out{fill:#0f172a;stroke:#1e293b;stroke-width:1;stroke-dasharray:3 3}
  .freeze{stroke:#2563eb;stroke-width:1.6}
</style>
<rect x="0" y="0" width="880" height="200" fill="#0f172a"/>
<rect x="0" y="0" width="6" height="200" fill="#2563eb"/>

<text class="name" x="40" y="76">cubrid-testkit</text>
<text class="tag"  x="41" y="104">Replace CTP one task at a time, while everything the outside can see stays byte-identical.</text>
<text class="tag"  x="41" y="123">And separate what tests the engine from what merely runs QA around it.</text>
<text class="meta" x="41" y="158">FOR ENGINE DEVELOPERS AND QA · CUBRID SYSTEMS RESEARCH</text>

<!-- task chips: one replaced, the rest still legacy, one excluded -->
<text class="lbl" x="576" y="30">REPLACED</text>
<rect class="new" x="572" y="38" width="86" height="20" rx="4"/><text class="chip" x="583" y="52">shell</text>
<rect class="new" x="664" y="38" width="86" height="20" rx="4"/><text class="chip" x="678" y="52">rqg</text>
<rect class="new" x="756" y="38" width="86" height="20" rx="4"/><text class="chip" x="763" y="52">unittest</text>

<text class="lbl" x="576" y="82">STILL CTP</text>
<rect class="old" x="572" y="90" width="86" height="20" rx="4"/><text class="chipo" x="590" y="104">sql</text>
<rect class="old" x="664" y="90" width="86" height="20" rx="4"/><text class="chipo" x="674" y="104">isolation</text>
<rect class="old" x="756" y="90" width="86" height="20" rx="4"/><text class="chipo" x="775" y="104">jdbc</text>

<text class="lbl" x="576" y="134">EXCLUDED — QA OPERATIONS</text>
<rect class="out" x="572" y="142" width="130" height="20" rx="4"/><text class="chipo" x="581" y="156">scheduler · mail</text>
<rect class="out" x="708" y="142" width="134" height="20" rx="4"/><text class="chipo" x="717" y="156">issue · reporting</text>

<line class="freeze" x1="572" y1="176" x2="842" y2="176"/>
<text class="lbl" x="572" y="190">ONE FROZEN SURFACE UNDERNEATH ALL OF IT</text>
</svg>
