<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="shell-overview-title shell-overview-desc">
<title id="shell-overview-title">The shell category in one picture</title>
<desc id="shell-overview-desc">testkit shell reads its configuration and a read-only corpus, and writes the frozen result files CTP wrote. It runs cases in N slots pulling from one queue; each slot has its own PID, IPC, mount and network namespaces and keeps the shipped port 1523. Every write a case makes lands in the slot's overlay upper layer — tmpfs with scenario_ram_mb, or a directory on disk with scenario_disk=on — never in the corpus, and is dropped when a directory's last case finishes.</desc>
<style>
  .ttl{font-size:16px;font-weight:700;fill:#1f2937}
  .sub{font-size:12px;fill:#6b7280}
  .eye{font-size:8px;font-weight:700;fill:#6b7280;letter-spacing:1px}
  .eye-b{font-size:8px;font-weight:700;fill:#2563eb;letter-spacing:1px}
  .name{font-size:12px;font-weight:700;fill:#1f2937}
  .dots{font-size:16px;font-weight:700;fill:#9ca3af}
  .d{font-size:12px;fill:#6b7280}
  .m{font-size:12px;fill:#1f2937;font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .mb{font-size:12px;fill:#2563eb;font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .note{font-size:12px;fill:#9ca3af}
  .wire{fill:none;stroke:#6b7280;stroke-width:1.2}
</style>
<defs>
  <marker id="shell-overview-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="880" height="520" fill="#ffffff"/>

<text class="ttl" x="24" y="32">The shell category in one picture</text>
<text class="sub" x="24" y="52">The corpus is never written. Every slot runs cases in namespaces of its own and writes into a layer that is thrown away.</text>

<!-- connectors -->
<path class="wire" d="M184,104 H216 Q224,104 224,112 V120 Q224,128 232,128 H264" marker-end="url(#shell-overview-arrow)"/>
<path class="wire" d="M184,176 H216 Q224,176 224,168 Q224,160 232,160 H264" marker-end="url(#shell-overview-arrow)"/>
<path class="wire" d="M440,144 H520" marker-end="url(#shell-overview-arrow)"/>
<path class="wire" d="M328,184 V212 Q328,220 320,220 H192 Q184,220 184,228 V256" marker-end="url(#shell-overview-arrow)"/>
<path class="wire" d="M352,184 V256" marker-end="url(#shell-overview-arrow)"/>
<path class="wire" d="M376,184 V212 Q376,220 384,220 H584 Q592,220 592,228 V256" marker-end="url(#shell-overview-arrow)"/>
<path class="wire" d="M184,344 V392" marker-end="url(#shell-overview-arrow)"/>
<path class="wire" d="M352,344 V392" marker-end="url(#shell-overview-arrow)"/>
<path class="wire" d="M592,344 V392" marker-end="url(#shell-overview-arrow)"/>

<!-- inputs -->
<rect x="24" y="80" width="160" height="48" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text class="eye" x="40" y="96">CONFIGURATION</text>
<text class="m" x="40" y="116">shell.conf</text>

<rect x="24" y="144" width="160" height="64" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text class="eye" x="40" y="160">THE CORPUS</text>
<text class="m" x="40" y="180">scenario</text>
<text class="d" x="40" y="196">read-only</text>

<!-- the runner -->
<rect x="264" y="104" width="176" height="80" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text class="eye-b" x="352" y="124" text-anchor="middle">TESTKIT</text>
<text class="mb" x="352" y="148" text-anchor="middle">testkit shell</text>
<text class="d" x="352" y="168" text-anchor="middle">one queue, N slots</text>

<!-- what it writes -->
<rect x="520" y="88" width="336" height="112" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text class="eye" x="536" y="108">RESULT FILES — FROZEN</text>
<text class="m" x="536" y="132">dispatch_tc_ALL.txt · test_status.data</text>
<text class="m" x="536" y="148">feedback.log · test-shell.xml · …</text>
<text class="name" x="536" y="172">the same bytes CTP wrote</text>
<text class="d" x="536" y="188">six of them held to zero against CTP</text>

<!-- slots -->
<rect x="112" y="256" width="144" height="88" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text class="eye" x="128" y="276">SLOT 0</text>
<text class="name" x="128" y="296">own namespaces</text>
<text class="d" x="128" y="316">PID · IPC · mount · net</text>
<text class="d" x="128" y="332">one case at a time</text>

<rect x="280" y="256" width="144" height="88" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text class="eye" x="296" y="276">SLOT 1</text>
<text class="name" x="296" y="296">own namespaces</text>
<text class="d" x="296" y="316">PID · IPC · mount · net</text>
<text class="d" x="296" y="332">one case at a time</text>

<text class="dots" x="472" y="304" text-anchor="middle">…</text>

<rect x="520" y="256" width="144" height="88" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
<text class="eye" x="536" y="276">SLOT N</text>
<text class="name" x="536" y="296">own namespaces</text>
<text class="d" x="536" y="316">PID · IPC · mount · net</text>
<text class="d" x="536" y="332">one case at a time</text>

<text class="d" x="688" y="284">every slot keeps the</text>
<text class="d" x="688" y="300">shipped port 1523;</text>
<text class="d" x="688" y="316">nothing is reconfigured</text>

<!-- the layer writes land in -->
<rect x="112" y="392" width="552" height="88" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
<text class="eye" x="128" y="412">OVERLAY UPPER LAYER — ONE PER SLOT</text>
<text class="name" x="128" y="432">every write a case makes lands here, never in the corpus</text>
<text class="d" x="128" y="452">tmpfs with scenario_ram_mb, or the slot's own directory with scenario_disk=on</text>
<text class="d" x="128" y="468">dropped when a directory's last case finishes</text>

<text class="note" x="24" y="504">Namespaces need TESTKIT_CONTAIN=1; without it, slots refuse to start rather than collide.</text>
</svg>
