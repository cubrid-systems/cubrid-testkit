<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="slot-title slot-desc">
<title id="slot-title">What a slot is</title>
<desc id="slot-desc">The machine's $CUBRID install, the scenario and $CUBRID_DATABASES are lower layers no slot writes. Each slot mounts an overlay on them whose upper layer is tmpfs or disk, and has its own network namespace keeping port 1523, its own PID namespace so pkill stays inside, and its own IPC namespace so broker shared memory does not collide. /tmp is not separated: it is the machine's and every slot shares it.</desc>
<style>
  .ttl{font-size:16px;font-weight:700;fill:#1f2937}
  .sub{font-size:12px;fill:#6b7280}
  .eye{font-size:8px;font-weight:700;fill:#6b7280;letter-spacing:1px}
  .name{font-size:12px;font-weight:700;fill:#1f2937}
  .name-a{font-size:12px;font-weight:700;fill:#b45309}
  .d{font-size:12px;fill:#6b7280}
  .m{font-size:12px;fill:#1f2937;font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .mb{font-size:12px;fill:#1e40af;font-family:"SFMono-Regular",Menlo,Consolas,monospace}
  .note{font-size:12px;fill:#9ca3af}
  .wire{fill:none;stroke:#6b7280;stroke-width:1.2}
  .zone{fill:#f9fafb;stroke:#e5e7eb;stroke-width:1}
  .row{fill:#ffffff;stroke:#d1d5db;stroke-width:1}
  .ovl{fill:#eff6ff;stroke:#2563eb;stroke-width:1.2}
  .shared{fill:#fffbeb;stroke:#b45309;stroke-width:1;stroke-dasharray:4 3}
</style>
<defs>
  <marker id="slot-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="880" height="452" fill="#ffffff"/>

<text class="ttl" x="24" y="32">What a slot is</text>
<text class="sub" x="24" y="52">One case at a time in namespaces of its own — every slot believes it is the only CUBRID on the machine.</text>

<!-- zones first -->
<rect class="zone" x="24" y="96" width="224" height="312" rx="8"/>
<text class="eye" x="40" y="116">THE MACHINE</text>
<rect class="zone" x="296" y="96" width="264" height="312" rx="8"/>
<text class="eye" x="312" y="116">SLOT 0</text>
<rect class="zone" x="592" y="96" width="264" height="312" rx="8"/>
<text class="eye" x="608" y="116">SLOT 1</text>

<!-- connectors: the machine is the lower layer of every slot -->
<path class="wire" d="M248,160 H312" marker-end="url(#slot-arrow)"/>
<path class="wire" d="M136,96 V84 Q136,76 144,76 H568 Q576,76 576,84 V152 Q576,160 584,160 H608" marker-end="url(#slot-arrow)"/>

<!-- the machine -->
<rect class="row" x="40" y="128" width="192" height="48" rx="6"/>
<text class="m" x="56" y="148">$CUBRID</text>
<text class="d" x="56" y="164">the real install</text>
<rect class="row" x="40" y="192" width="192" height="48" rx="6"/>
<text class="m" x="56" y="212">scenario</text>
<text class="d" x="56" y="228">the repository</text>
<rect class="row" x="40" y="256" width="192" height="48" rx="6"/>
<text class="m" x="56" y="276">$CUBRID_DATABASES</text>
<text class="d" x="56" y="292">the registry</text>
<text class="d" x="40" y="340">lower layers:</text>
<text class="d" x="40" y="356">no slot writes to them</text>

<!-- slot 0 -->
<rect class="ovl" x="312" y="128" width="232" height="64" rx="6"/>
<text class="name" x="328" y="148">mount · overlay</text>
<text class="mb" x="328" y="164">lower = the machine's</text>
<text class="mb" x="328" y="180">upper = tmpfs or disk</text>
<rect class="row" x="312" y="208" width="232" height="40" rx="6"/>
<text class="name" x="328" y="232">network</text><text class="d" x="408" y="232">keeps port 1523</text>
<rect class="row" x="312" y="256" width="232" height="40" rx="6"/>
<text class="name" x="328" y="280">PID</text><text class="d" x="408" y="280">pkill stays inside</text>
<rect class="row" x="312" y="304" width="232" height="40" rx="6"/>
<text class="name" x="328" y="328">IPC</text><text class="d" x="408" y="328">shared memory apart</text>
<rect class="shared" x="312" y="352" width="232" height="40" rx="6"/>
<text class="name-a" x="328" y="376">/tmp</text><text class="d" x="408" y="376">the machine's, shared</text>

<!-- slot 1 -->
<rect class="ovl" x="608" y="128" width="232" height="64" rx="6"/>
<text class="name" x="624" y="148">mount · overlay</text>
<text class="mb" x="624" y="164">lower = the machine's</text>
<text class="mb" x="624" y="180">upper = tmpfs or disk</text>
<rect class="row" x="608" y="208" width="232" height="40" rx="6"/>
<text class="name" x="624" y="232">network</text><text class="d" x="704" y="232">keeps port 1523</text>
<rect class="row" x="608" y="256" width="232" height="40" rx="6"/>
<text class="name" x="624" y="280">PID</text><text class="d" x="704" y="280">pkill stays inside</text>
<rect class="row" x="608" y="304" width="232" height="40" rx="6"/>
<text class="name" x="624" y="328">IPC</text><text class="d" x="704" y="328">shared memory apart</text>
<rect class="shared" x="608" y="352" width="232" height="40" rx="6"/>
<text class="name-a" x="624" y="376">/tmp</text><text class="d" x="704" y="376">the machine's, shared</text>

<text class="note" x="24" y="436">cub_master's socket moved to CUBRID_TMP, each slot's own $CUBRID/tmp. A case writing a fixed name under /tmp still shares it.</text>
</svg>
